[project]
name = "icloud-mcp"
version = "0.2.1"
description = "MCP server for your iCloud mail, calendars and contacts, with an app-specific password"
requires-python = ">=3.12"
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    # Upper bounds are deliberate. The server image is rebuilt on every deploy,
    # so an open constraint means the next deploy installs whatever is newest;
    # mcp 2.0 already removed mcp.server.fastmcp once.
    "mcp>=2.1,<3",
    "httpx>=0.27,<1",
    "starlette>=0.40",
    "uvicorn[standard]>=0.32",
    # the account page's forms
    "python-multipart>=0.0.9",
    # calendar events (calendar.py) and their series, expanded into single dates
    "icalendar>=7,<8",
    "recurring-ical-events>=3.8,<4",
    # time zones in the slim image, which has no system zoneinfo
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
icloud-mcp = "icloud_mcp.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["icloud_mcp*"]

[tool.setuptools.package-data]
# msk-ui (static/ui/ is a copy of the author's design system),
# app.css and the logo.
icloud_mcp = ["static/*", "static/ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
